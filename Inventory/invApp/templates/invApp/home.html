<!-- Extend the base layout from the layout.html -->
{% extends "invApp/layout.html" %}

{% block title %} Home {% endblock %}

{% block content %}
  <style>
    /* Styling adjustments specifically for the Home view */
    .jumbotron {
        background-color: var(--card-bg, #ffffff);
        border: 1px solid var(--border-color, #e2e8f0);
        border-radius: 12px;
        padding: 3.5rem 2rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .jumbotron .display-4 {
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--text-dark, #0f172a);
        margin-bottom: 1rem;
    }

    .jumbotron .lead {
        font-size: 1.125rem;
        font-weight: 400;
        color: var(--text-muted, #64748b);
        line-height: 1.6;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
    }

    .jumbotron hr {
        border-top-color: var(--border-color, #e2e8f0);
        opacity: 0.6;
        max-width: 400px;
    }

    .jumbotron p:not(.lead) {
        font-size: 0.95rem;
        color: var(--text-muted, #64748b);
        margin-bottom: 1.75rem;
    }

    .jumbotron .btn-lg {
        padding: 0.75rem 1.75rem;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        transition: all 0.15s ease-in-out;
    }

    .jumbotron .btn-lg:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
    }
  </style>

  <div class="jumbotron text-center">
    <h1 class="display-4">Welcome to the Inventory Management System</h1>
    <p class="lead">
        Manage your products efficiently and effectively.
    </p>
    <hr class="my-4">
    <p>
        Use the navigation bar to add, view, update or delete products.
    </p>
    <a href="{% url 'product_list' %}" class="btn btn-primary btn-lg" role="button">View Products</a>
  </div>
{% endblock %}
